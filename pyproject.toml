[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-labor-observatory"
version = "0.1.0"
description = "A reproducible observatory for AI skill demand, wages, tasks, education, and geography."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aarav Nagar" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=2.0,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "statsmodels>=0.14,<1",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
labor-observatory = "ai_labor_observatory.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_labor_observatory"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
